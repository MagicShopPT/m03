<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX02 — Conditions | Módulo 03</title>
</head>
<body>
    <header>
        <h1>Classificador de Notas (EX02 — Conditions)</h1>
        <p>Estudante: Vitor Ângelo Medeiros e Silva (N.º 13422, 51 anos)</p>
    </header>

    <main>
        <section>
            <h2>Introduzir Nota (0 a 20)</h2>
            <form id="grade-form">
                <label for="grade-input">Nota:</label>
                <input
                    type="number"
                    id="grade-input"
                    name="grade"
                    step="0.1"
                    min="0"
                    max="20"
                    placeholder="Ex.: 15.5"
                    required
                >
                <button type="submit">Classificar</button>
            </form>
        </section>

        <section id="result-section" aria-live="polite">
            <h2>Resultado</h2>
            <p id="grade-result">Introduza uma nota e clique em "Classificar".</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
