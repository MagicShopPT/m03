<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX07 — Array Toolkit | Módulo 03</title>
</head>
<body>
    <header>
        <h1>Array Toolkit (EX07 — Array Toolkit)</h1>
        <p>Estudante: Vitor Ângelo Medeiros e Silva (N.º 13422, 51 anos)</p>
    </header>

    <main>
        <section>
            <h2>Coleção de Teste</h2>
            <form id="toolkit-form">
                <div>
                    <label for="array-input">Números (separados por vírgula):</label>
                    <input
                        type="text"
                        id="array-input"
                        value="2, 5, 8, 11, 14, 5, 20"
                        required
                    >
                </div>

                <div>
                    <label for="target-input">Valor a procurar (<code>includes</code> e <code>find &gt; X</code>):</label>
                    <input
                        type="number"
                        id="target-input"
                        value="8"
                        required
                    >
                </div>

                <button type="submit">Executar Array Toolkit</button>
            </form>
            <p id="toolkit-error" role="alert"></p>
        </section>

        <section id="toolkit-results">
            <h2>Resultados (Implementações Manuais)</h2>
            <div id="toolkit-output"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
